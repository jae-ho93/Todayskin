# 로컬 개발용 PostgreSQL + Redis + NestJS + inference-service (T14/N5).
# 개발/테스트 DB를 하나의 인스턴스에 분리한다. 운영 DB는 별도 관리.
# 실행: docker compose up -d            # DB + Redis만 실행
# 실행: docker compose --profile inference up -d --build
#       # inference만 (로컬 nest watch용)
# 실행: docker compose --profile backend up -d --build
#       # NestJS + inference 포함 전체 실행
services:
  postgres:
    image: postgres:16-alpine
    container_name: todayskin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: todayskin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: todayskin_dev
    ports:
      - "5432:5432"
    volumes:
      - todayskin_pg_data:/var/lib/postgresql/data
      # init 스크립트로 dev/test DB를 분리 생성
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todayskin -d todayskin_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # T12: 날씨 캐시용 Redis. 캐시 부재 시 백엔드는 외부 API/DB fallback으로 동작한다.
  redis:
    image: redis:7-alpine
    container_name: todayskin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - todayskin_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # 운영에서는 requirepass로 인증 필수. 개발용은 비인증.
    # command: redis-server --requirepass yourpassword

  # N5: FastAPI inference-service. 모델 가중치가 이미지에 포함되므로 첫 빌드가 길 수 있다.
  # --profile inference: 로컬 nest watch와 함께 쓸 때
  # --profile backend: NestJS 통합 환경에 자동 포함
  inference:
    profiles: ["backend", "inference"]
    build:
      context: ./inference-service
      dockerfile: Dockerfile
    container_name: todayskin-inference
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      # N13: NestJS↔inference 내부망 인증 — backend 서비스와 같은 값을 공유해야 한다.
      INFERENCE_SHARED_SECRET: local_inference_shared_secret
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # T14/N5: NestJS 백엔드. 로컬 통합 환경은 development 모드로 실행해
  # MOCK_GEMINI를 안전하게 사용할 수 있게 한다. 운영은 이 compose의
  # 임시 mock 설정을 재사용하지 말고 별도 secret/config를 주입한다.
  backend:
    profiles: ["backend"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todayskin-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inference:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      ALLOWED_ORIGINS: http://localhost:8081
      DATABASE_URL: postgresql://todayskin:secret@postgres:5432/todayskin_dev
      REDIS_URL: redis://redis:6379
      # 로컬 통합 환경용 임시 시크릿. 운영에서는 별도 주입.
      JWT_ACCESS_SECRET: local_dev_access_secret_at_least_32_characters_long
      JWT_REFRESH_SECRET: local_dev_refresh_secret_at_least_32_characters_long
      MOCK_GEMINI: "true"
      # compose 통합 시 실제 inference 컨테이너를 사용한다.
      MOCK_INFERENCE: "false"
      INFERENCE_SERVICE_URL: http://inference:8000
      # N13: inference 컨테이너와 같은 값 (위 inference 서비스 참고).
      INFERENCE_SHARED_SECRET: local_inference_shared_secret
      # N5: 로컬/테스트만 컨테이너 시작 시 migrate 허용. 운영 ECS는 false.
      RUN_MIGRATIONS_ON_START: "true"
    ports:
      - "3000:3000"

volumes:
  todayskin_pg_data:
  todayskin_redis_data:
