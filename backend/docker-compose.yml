# 로컬 개발용 PostgreSQL + Redis + NestJS 백엔드 컨테이너 (T14).
# 개발/테스트 DB를 하나의 인스턴스에 분리한다. 운영 DB는 별도 관리.
# 실행: docker compose up -d            # DB + Redis만 실행
# 실행: docker compose --profile backend up -d --build   # 백엔드 포함 전체 실행
services:
  postgres:
    image: postgres:16-alpine
    container_name: todayskin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: todayskin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: todayskin_dev
    ports:
      - "5432:5432"
    volumes:
      - todayskin_pg_data:/var/lib/postgresql/data
      # init 스크립트로 dev/test DB를 분리 생성
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todayskin -d todayskin_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # T12: 날씨 캐시용 Redis. 캐시 부재 시 백엔드는 외부 API/DB fallback으로 동작한다.
  redis:
    image: redis:7-alpine
    container_name: todayskin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - todayskin_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # 운영에서는 requirepass로 인증 필수. 개발용은 비인증.
    # command: redis-server --requirepass yourpassword

  # T14: NestJS 백엔드. 빌드된 이미지로 DB/Redis와 통합 환경을 구성한다.
  backend:
    profiles: ["backend"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todayskin-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      ALLOWED_ORIGINS: http://localhost:8081
      DATABASE_URL: postgresql://todayskin:secret@postgres:5432/todayskin_dev
      REDIS_URL: redis://redis:6379
      # 로컬 통합 환경용 임시 시크릿. 운영에서는 별도 주입.
      JWT_ACCESS_SECRET: local_dev_access_secret_at_least_32_characters_long
      JWT_REFRESH_SECRET: local_dev_refresh_secret_at_least_32_characters_long
      MOCK_GEMINI: "true"
      MOCK_INFERENCE: "true"
    ports:
      - "3000:3000"

volumes:
  todayskin_pg_data:
  todayskin_redis_data:
