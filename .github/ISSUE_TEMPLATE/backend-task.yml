name: Backend Task
description: Todayskin 백엔드 기능 또는 전환 작업
title: "[Backend] "
labels:
  - backend
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 Task가 해결할 문제와 완료 후 상태를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 수정할 모듈, API, DB 모델 또는 설정을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: excluded
    attributes:
      label: 제외·보류 범위
      description: 이번 Task에서 하지 않을 내용을 작성합니다.
  - type: textarea
    id: files
    attributes:
      label: 예상 수정 파일
      description: 다른 작업자와 충돌을 피하기 위해 수정할 파일 또는 디렉터리를 작성합니다.
  - type: checkboxes
    id: done
    attributes:
      label: 완료 조건
      options:
        - label: 구현 또는 문서 작업이 완료됨
        - label: 관련 테스트 또는 검증이 완료됨
        - label: API/DB/환경변수 변경이 문서화됨
        - label: PR 리뷰와 CI가 완료됨
  - type: input
    id: branch
    attributes:
      label: 작업 브랜치
      placeholder: feature/example
