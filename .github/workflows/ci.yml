name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # AI 코딩 보조 도구(Codebuff·Cursor·Copilot 등) 공동저자/생성 표기 차단.
  # 사람 계정 외의 AI 트레일러가 PR 커밋에 있으면 실패 → 머지 차단.
  ai-author-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: AI 공동저자/생성 표기 검사
        shell: bash
        run: |
          set -euo pipefail
          pattern='(codebuff|cursor|copilot|claude|chatgpt|openai|anthropic|gemini|bard|codex|deepseek|qwen|mistral|codeium|tabnine|windsurf|aider|amazon)'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            messages=$(git log --format=%B "${base}..HEAD")
          else
            messages=$(git log --format=%B -10 HEAD)
          fi
          if printf '%s\n' "$messages" \
            | grep -Ein "^co-authored-by:.*${pattern}|^(generated|built|made|created) (with|by) ${pattern}"; then
            echo "::error::AI 코딩 보조 도구 공동저자/생성 표기가 커밋에 포함되어 있습니다. 제거 후 다시 푸시하세요."
            exit 1
          fi
          echo "AI 공동저자 표기 없음 ✅"

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  backend-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todayskin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: todayskin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todayskin -d todayskin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://todayskin:secret@localhost:5432/todayskin_test
      SHADOW_DATABASE_URL: postgresql://todayskin:secret@localhost:5432/todayskin_shadow
      JWT_ACCESS_SECRET: ci_test_access_secret_at_least_32_characters_long
      JWT_REFRESH_SECRET: ci_test_refresh_secret_at_least_32_characters_long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      # migration 검사: schema.prisma를 변경했지만 migration을 추가하지 않으면 실패(exit 2).
      # diff 검사용 shadow DB를 먼저 생성한다.
      - run: psql "$DATABASE_URL" -c "CREATE DATABASE todayskin_shadow;"
      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run build
      - run: npm test
      - run: npm run test:cov -- --coverageReporters=text-summary
      - run: npm run test:e2e
      - run: npm run lint
      # N6: critical/high 취약점은 CI 실패 (SLA: high 이상 차단)
      - run: npm run audit:ci
