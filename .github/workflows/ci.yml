name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # R15: strict 모드 typecheck + ESLint(경고도 실패), R16: jest 단위/계약 테스트
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # R28: 백엔드 DTO ↔ 프론트 타입 드리프트 차단.
  # 백엔드에서 OpenAPI 스펙을 다시 뽑고 프론트 타입을 다시 생성해, 커밋된 산출물과
  # 다르면 실패한다. 즉 DTO를 바꾸고 `npm run openapi:export && npm run openapi:types`를
  # 돌리지 않으면 머지되지 않는다. preview 모드라 DB·Redis 없이 수 초면 끝난다.
  api-contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefix backend
      - run: npm run prisma:generate --prefix backend
      - run: npm run openapi:export --prefix backend
      - run: npm ci
      - run: npm run openapi:types
      - name: 생성물이 커밋본과 같은지 확인
        run: git diff --exit-code -- backend/openapi.json src/types/api.generated.ts

  # inference-service 계약 테스트 (N13/R6/R32). analyzer/part_mapping을 stub하므로
  # torch·mediapipe 설치 없이 수 초 안에 끝난다.
  inference-contract-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/inference-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/inference-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  backend-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todayskin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: todayskin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todayskin -d todayskin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://todayskin:secret@localhost:5432/todayskin_test
      SHADOW_DATABASE_URL: postgresql://todayskin:secret@localhost:5432/todayskin_shadow
      JWT_ACCESS_SECRET: ci_test_access_secret_at_least_32_characters_long
      JWT_REFRESH_SECRET: ci_test_refresh_secret_at_least_32_characters_long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      # migration 검사: schema.prisma를 변경했지만 migration을 추가하지 않으면 실패(exit 2).
      # diff 검사용 shadow DB를 먼저 생성한다.
      - run: psql "$DATABASE_URL" -c "CREATE DATABASE todayskin_shadow;"
      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run build
      # build(`nest build`)는 tsconfig.build.json으로 spec/e2e를 제외하므로 테스트 코드의
      # 타입 오류를 잡지 못한다. typecheck는 src + test 전체를 본다.
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:cov -- --coverageReporters=text-summary
      - run: npm run test:e2e
      - run: npm run lint
      # N6: critical/high 취약점은 CI 실패 (SLA: high 이상 차단)
      - run: npm run audit:ci
