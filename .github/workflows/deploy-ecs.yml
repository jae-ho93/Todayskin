name: Deploy ECS Fargate

# N5: CI 통과 후 ECR push → (승인) release job(migration) → NestJS/FastAPI Fargate rollout.
# Secrets/vars는 GitHub Environment `production`과 Repository Variables에 설정한다.
# 실제 AWS 리소스 ARN은 ACCOUNT_ID placeholder를 치환한 task definition으로 등록한다.

# R31: main push에 직접 걸면 CI와 배포가 병렬로 시작해, 테스트가 깨진 커밋도
# 승인만 있으면 배포된다. CI 워크플로 완료(success)를 트리거로 삼아 게이팅한다.
# workflow_run은 paths 필터를 지원하지 않으므로 guard job에서 직접 확인한다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy/rollback용 이미지 태그(commit SHA). 비우면 현재 SHA."
        required: false
        type: string
      skip_migrate:
        description: "rollback 시 migration 생략"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-ecs-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  ECR_BACKEND_REPO: ${{ vars.ECR_BACKEND_REPO || 'todayskin-backend' }}
  ECR_INFERENCE_REPO: ${{ vars.ECR_INFERENCE_REPO || 'todayskin-inference' }}

jobs:
  # R31: CI 성공 + 배포 대상 변경 여부를 한곳에서 판단한다. 여기서 false면
  # 이후 job이 전부 스킵되므로 프론트 전용 커밋으로 배포가 돌지 않는다
  # (기존 paths 필터와 동일한 역할).
  guard:
    name: Gate on CI result
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - name: Resolve commit to deploy
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # workflow_run의 GITHUB_SHA는 기본 브랜치 최신 커밋이라 CI가 검증한
            # 커밋과 다를 수 있다. 반드시 head_sha를 쓴다.
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 2

      - name: Check backend changes
        id: changes
        run: |
          set -euo pipefail
          # 수동 실행(배포·롤백)은 항상 진행한다.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD^ HEAD || true)
          if [ -z "${CHANGED}" ]; then
            # 첫 커밋 등 비교 대상이 없으면 안전하게 배포를 진행한다.
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "${CHANGED}" | grep -Eq '^(backend/|\.github/workflows/deploy-ecs\.yml$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Backend 변경 없음 — 배포를 건너뜁니다."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build and push ECR images
    needs: guard
    if: ${{ needs.guard.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      inference_image: ${{ steps.meta.outputs.inference_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ needs.guard.outputs.sha }}"
          fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${ECR_BACKEND_REPO}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "inference_image=${ECR_INFERENCE_REPO}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push NestJS backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push inference service
        uses: docker/build-push-action@v6
        with:
          context: backend/inference-service
          file: backend/inference-service/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_INFERENCE_REPO }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha,scope=inference
          cache-to: type=gha,mode=max,scope=inference

  release:
    name: Release (migrate + deploy)
    needs: [guard, build-and-push]
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE_BACKEND: ${{ vars.ECS_SERVICE_BACKEND }}
      ECS_SERVICE_INFERENCE: ${{ vars.ECS_SERVICE_INFERENCE }}
      # R13: 워커 서비스. 아직 만들지 않았으면 비워 두면 rollout 단계가 스킵된다.
      ECS_SERVICE_WORKER: ${{ vars.ECS_SERVICE_WORKER }}
      ECS_MIGRATE_TASK_FAMILY: ${{ vars.ECS_MIGRATE_TASK_FAMILY || 'todayskin-migrate' }}
      ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
      ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
      RDS_INSTANCE_ID: ${{ vars.RDS_INSTANCE_ID }}
      # R31: 셸에서 참조하던 변수를 job env로 전달한다. 이전에는 전달되지 않아
      # 항상 ENABLED로 고정이었고 오버라이드가 동작하지 않았다.
      ECS_ASSIGN_PUBLIC_IP: ${{ vars.ECS_ASSIGN_PUBLIC_IP }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Backup RDS (snapshot)
        if: ${{ inputs.skip_migrate != true }}
        run: |
          set -euo pipefail
          if [ -z "${RDS_INSTANCE_ID}" ]; then
            echo "RDS_INSTANCE_ID is not set; skip automated snapshot (document manual backup)."
            exit 0
          fi
          SNAPSHOT_ID="todayskin-pre-release-$(echo "${IMAGE_TAG}" | cut -c1-12)-$(date +%Y%m%d%H%M%S)"
          aws rds create-db-snapshot \
            --db-instance-identifier "${RDS_INSTANCE_ID}" \
            --db-snapshot-identifier "${SNAPSHOT_ID}"
          echo "Created snapshot: ${SNAPSHOT_ID}"
          echo "SNAPSHOT_ID=${SNAPSHOT_ID}" >> "$GITHUB_ENV"

      - name: Render migrate task definition
        if: ${{ inputs.skip_migrate != true }}
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          ACCOUNT_ID="$(echo "$REGISTRY" | cut -d. -f1)"
          sed \
            -e "s|ACCOUNT_ID|${ACCOUNT_ID}|g" \
            -e "s|IMAGE_TAG|${IMAGE_TAG}|g" \
            backend/docker/ecs/migrate-task-definition.json > /tmp/migrate-task.json
          aws ecs register-task-definition --cli-input-json file:///tmp/migrate-task.json

      - name: Run migrate task (diff + deploy)
        if: ${{ inputs.skip_migrate != true }}
        run: |
          set -euo pipefail
          if [ -z "${ECS_CLUSTER}" ] || [ -z "${ECS_SUBNETS}" ] || [ -z "${ECS_SECURITY_GROUPS}" ]; then
            echo "ECS_CLUSTER / ECS_SUBNETS / ECS_SECURITY_GROUPS required for migrate task."
            exit 1
          fi
          SUBNET_JSON=$(printf '%s' "${ECS_SUBNETS}" | jq -R 'split(",")')
          SG_JSON=$(printf '%s' "${ECS_SECURITY_GROUPS}" | jq -R 'split(",")')
          # 2026-08-12 네트워킹 확정: backend는 public subnet + NAT 미사용(IGW 경유) →
          # 태스크에 퍼블릭 IP를 할당해야 ECR pull/아웃바운드가 된다.
          # (NAT gateway 사용 시 DISABLED로 되돌리면 됨 — GitHub Variable ECS_ASSIGN_PUBLIC_IP로 오버라이드 가능)
          ASSIGN_PUBLIC_IP="${ECS_ASSIGN_PUBLIC_IP:-ENABLED}"
          TASK_ARN=$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --launch-type FARGATE \
            --task-definition "${ECS_MIGRATE_TASK_FAMILY}" \
            --network-configuration "awsvpcConfiguration={subnets=${SUBNET_JSON},securityGroups=${SG_JSON},assignPublicIp=${ASSIGN_PUBLIC_IP}}" \
            --query 'tasks[0].taskArn' \
            --output text)
          echo "Migrate task: ${TASK_ARN}"
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}"
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" \
            --tasks "${TASK_ARN}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          if [ "${EXIT_CODE}" != "0" ]; then
            echo "Migration failed with exit code ${EXIT_CODE}. Aborting app rollout."
            exit 1
          fi

      - name: Render and deploy NestJS service
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          ACCOUNT_ID="$(echo "$REGISTRY" | cut -d. -f1)"
          sed \
            -e "s|ACCOUNT_ID|${ACCOUNT_ID}|g" \
            -e "s|IMAGE_TAG|${IMAGE_TAG}|g" \
            backend/docker/ecs/backend-task-definition.json > /tmp/backend-task.json
          NEW_TD=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/backend-task.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE_BACKEND}" \
            --task-definition "${NEW_TD}" \
            --force-new-deployment

      # R13: 잡 처리 전용 서비스. API보다 먼저 새 이미지로 올려, API를
      # JOB_ROLE=api로 내리기 전에 워커가 큐를 소비하고 있음을 보장한다.
      - name: Render and deploy worker service
        if: ${{ vars.ECS_SERVICE_WORKER != '' }}
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          ACCOUNT_ID="$(echo "$REGISTRY" | cut -d. -f1)"
          sed \
            -e "s|ACCOUNT_ID|${ACCOUNT_ID}|g" \
            -e "s|IMAGE_TAG|${IMAGE_TAG}|g" \
            backend/docker/ecs/worker-task-definition.json > /tmp/worker-task.json
          NEW_TD=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/worker-task.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE_WORKER}" \
            --task-definition "${NEW_TD}" \
            --force-new-deployment

      - name: Render and deploy inference service
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          ACCOUNT_ID="$(echo "$REGISTRY" | cut -d. -f1)"
          sed \
            -e "s|ACCOUNT_ID|${ACCOUNT_ID}|g" \
            -e "s|IMAGE_TAG|${IMAGE_TAG}|g" \
            backend/docker/ecs/inference-task-definition.json > /tmp/inference-task.json
          NEW_TD=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/inference-task.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE_INFERENCE}" \
            --task-definition "${NEW_TD}" \
            --force-new-deployment

      - name: Wait for services stable
        run: |
          set -euo pipefail
          SERVICES=("${ECS_SERVICE_BACKEND}" "${ECS_SERVICE_INFERENCE}")
          if [ -n "${ECS_SERVICE_WORKER}" ]; then
            SERVICES+=("${ECS_SERVICE_WORKER}")
          fi
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${SERVICES[@]}"

  rollback-docs:
    name: Rollback instructions
    if: failure()
    needs: [guard, build-and-push, release]
    runs-on: ubuntu-latest
    steps:
      - name: Print rollback procedure
        run: |
          cat <<'EOF'
          Deployment failed. Rollback procedure:
          1. Actions → Deploy ECS Fargate → Run workflow
          2. image_tag = previous successful commit SHA (ECR image tag)
          3. skip_migrate = true (schema already applied or rollback via new migration)
          4. Approve the production environment gate
          See docs/DEPLOYMENT.md § Rollback
          EOF
